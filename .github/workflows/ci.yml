name: CI

on:
  pull_request:
  merge_group:
  workflow_dispatch:
  schedule:
    - cron: "23 18 * * *"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Change scope
    runs-on: ubuntu-latest
    outputs:
      heavy: ${{ steps.plan.outputs.heavy }}
      mode: ${{ steps.plan.outputs.mode }}
      e2e_args: ${{ steps.plan.outputs.e2e_args }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: plan
        name: Plan CI validation
        env:
          EVENT_NAME: ${{ github.event_name }}
          PULL_REQUEST_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          MERGE_GROUP_BASE_SHA: ${{ github.event.merge_group.base_sha }}
        shell: bash
        run: |
          force_args=()
          case "$EVENT_NAME" in
            pull_request)
              base="$PULL_REQUEST_BASE_SHA"
              ;;
            merge_group)
              base="$MERGE_GROUP_BASE_SHA"
              force_args+=(--force-full)
              ;;
            *)
              base="$(git rev-parse HEAD^ 2>/dev/null || git rev-parse HEAD)"
              force_args+=(--force-full)
              ;;
          esac
          if [[ -z "$base" ]] || ! git rev-parse --verify "$base^{commit}" >/dev/null 2>&1; then
            base="$(git merge-base origin/main HEAD)"
          fi
          node scripts/ci-plan.mjs \
            --base "$base" \
            "${force_args[@]}" \
            --github-output \
            --github-summary
      - name: Check test-impact declaration
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node scripts/check-test-impact.mjs --base "$BASE_SHA"
      - name: Check local Markdown links
        run: node scripts/check-markdown-links.mjs

  static:
    name: Static contracts
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - if: needs.changes.outputs.heavy != 'true'
        run: echo "Documentation-only change; static contracts are unchanged."
      - if: needs.changes.outputs.heavy == 'true'
        uses: actions/checkout@v4
      - if: needs.changes.outputs.heavy == 'true'
        uses: pnpm/action-setup@v4
        with:
          version: 11.16.0
      - if: needs.changes.outputs.heavy == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - if: needs.changes.outputs.heavy == 'true'
        run: pnpm install --frozen-lockfile
      - if: needs.changes.outputs.heavy == 'true'
        run: pnpm ci:static

  unit:
    name: Unit and integration tests
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - if: needs.changes.outputs.heavy != 'true'
        run: echo "Documentation-only change; unit contracts are unchanged."
      - if: needs.changes.outputs.heavy == 'true'
        uses: actions/checkout@v4
      - if: needs.changes.outputs.heavy == 'true'
        uses: pnpm/action-setup@v4
        with:
          version: 11.16.0
      - if: needs.changes.outputs.heavy == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - if: needs.changes.outputs.heavy == 'true'
        run: pnpm install --frozen-lockfile
      - if: needs.changes.outputs.heavy == 'true'
        run: pnpm ci:unit

  release:
    name: Release contracts
    needs: changes
    runs-on: ubuntu-latest
    # This job contains the performance baseline and remains mandatory for
    # every implementation change, even when browser coverage is focused.
    container:
      image: ${{ needs.changes.outputs.heavy == 'true' && 'mcr.microsoft.com/playwright:v1.62.1-noble@sha256:dcc5531e97840b9b5e794f2814476b21571c5124a3fca2267d73041f56e7580e' || 'node:24-bookworm' }}
      options: --ipc=host
    defaults:
      run:
        shell: bash
    timeout-minutes: 25
    steps:
      - if: needs.changes.outputs.heavy != 'true'
        run: echo "Documentation-only change; release contracts are unchanged."
      - if: needs.changes.outputs.heavy == 'true'
        uses: actions/checkout@v4
      - if: needs.changes.outputs.heavy == 'true'
        uses: pnpm/action-setup@v4
        with:
          version: 11.16.0
      - if: needs.changes.outputs.heavy == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - if: needs.changes.outputs.heavy == 'true'
        run: pnpm install --frozen-lockfile
      - if: needs.changes.outputs.heavy == 'true'
        # The version-matched image already provides Chromium and its Linux
        # dependencies. Keep setup:e2e as an explicit one-time local command.
        run: pnpm release:verify

  e2e:
    name: Browser tests (${{ matrix.shard }})
    needs: changes
    runs-on: ubuntu-latest
    container:
      image: ${{ needs.changes.outputs.heavy == 'true' && 'mcr.microsoft.com/playwright:v1.62.1-noble@sha256:dcc5531e97840b9b5e794f2814476b21571c5124a3fca2267d73041f56e7580e' || 'node:24-bookworm' }}
      options: --ipc=host
    defaults:
      run:
        shell: bash
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # Four shards, three Playwright workers each on 4-vCPU runners:
        # twelve browser workers.
        # The required-check names migrated with this split (ruleset updated
        # in the same change window).
        shard:
          - 1/4
          - 2/4
          - 3/4
          - 4/4
    steps:
      - if: needs.changes.outputs.heavy != 'true'
        run: echo "Documentation-only change; browser contracts are unchanged."
      - if: needs.changes.outputs.heavy == 'true'
        uses: actions/checkout@v4
      - if: needs.changes.outputs.heavy == 'true'
        uses: pnpm/action-setup@v4
        with:
          version: 11.16.0
      - if: needs.changes.outputs.heavy == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - if: needs.changes.outputs.heavy == 'true'
        run: pnpm install --frozen-lockfile
      - if: needs.changes.outputs.heavy == 'true'
        env:
          E2E_ARGS: ${{ needs.changes.outputs.e2e_args }}
        run: |
          read -r -a specs <<< "$E2E_ARGS"
          pnpm ci:e2e --workers=3 --shard=${{ matrix.shard }} "${specs[@]}"
