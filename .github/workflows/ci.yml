name: CI

on:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "23 18 * * *"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Change scope
    runs-on: ubuntu-latest
    outputs:
      heavy: ${{ steps.plan.outputs.heavy }}
      browser: ${{ steps.plan.outputs.browser }}
      browser_shards: ${{ steps.plan.outputs.browser_shards }}
      mode: ${{ steps.plan.outputs.mode }}
      e2e_args: ${{ steps.plan.outputs.e2e_args }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Pull requests need their complete commit range for Test-Impact.
          # Scheduled and manual runs inspect only the checked-out commit, so
          # two commits avoid an unbounded all-ref fetch.
          fetch-depth: ${{ github.event_name == 'pull_request' && '0' || '2' }}
      - id: plan
        name: Plan CI validation
        env:
          EVENT_NAME: ${{ github.event_name }}
          PULL_REQUEST_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        shell: bash
        run: |
          force_args=()
          case "$EVENT_NAME" in
            pull_request)
              base="$PULL_REQUEST_BASE_SHA"
              ;;
            *)
              base="$(git rev-parse HEAD^ 2>/dev/null || git rev-parse HEAD)"
              force_args+=(--force-full)
              ;;
          esac
          if [[ -z "$base" ]] || ! git rev-parse --verify "$base^{commit}" >/dev/null 2>&1; then
            base="$(git merge-base origin/main HEAD)"
          fi
          node scripts/ci-plan.mjs \
            --base "$base" \
            "${force_args[@]}" \
            --github-output \
            --github-summary
      - name: Check test-impact declaration
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node scripts/check-test-impact.mjs --base "$BASE_SHA"
      - name: Check local Markdown links
        run: node scripts/check-markdown-links.mjs

  core:
    name: Core contracts
    needs: changes
    if: needs.changes.outputs.heavy == 'true'
    runs-on: ubuntu-latest
    env:
      PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH: /usr/bin/google-chrome
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.16.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Static contracts
        run: pnpm ci:static
      - name: Unit and integration tests
        run: pnpm ci:unit
      - name: Release contracts
        # GitHub's Ubuntu image already carries Chrome. Keep setup:e2e as an
        # explicit one-time local command instead of pulling a CI container.
        run: pnpm release:verify

  browser_shard:
    name: Browser tests (${{ matrix.shard }})
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.browser == 'true'
    runs-on: ubuntu-latest
    env:
      PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH: /usr/bin/google-chrome
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # Broad batches need more parallelism, not a larger per-job timeout.
        shard: ${{ fromJSON(needs.changes.outputs.browser_shards) }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.16.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - env:
          E2E_ARGS: ${{ needs.changes.outputs.e2e_args }}
        run: |
          read -r -a specs <<< "$E2E_ARGS"
          test "${#specs[@]}" -gt 0
          pnpm ci:e2e --workers=3 --shard=${{ matrix.shard }} "${specs[@]}"

  browser:
    name: Browser tests
    needs:
      - changes
      - browser_shard
    if: always() && github.event_name == 'pull_request' && needs.changes.outputs.browser == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Confirm every selected browser shard passed
        env:
          SHARD_RESULT: ${{ needs.browser_shard.result }}
        run: test "$SHARD_RESULT" = "success"

  full_browser_audit:
    name: Full browser audit (${{ matrix.shard }})
    needs: changes
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    env:
      PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH: /usr/bin/google-chrome
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # Full coverage is an audit, not a per-PR tax. Four shards retain its
        # wall-clock speed without charging every candidate for all 489 tests.
        shard:
          - 1/4
          - 2/4
          - 3/4
          - 4/4
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.16.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - env:
          E2E_ARGS: ${{ needs.changes.outputs.e2e_args }}
        run: |
          read -r -a specs <<< "$E2E_ARGS"
          pnpm ci:e2e --workers=2 --shard=${{ matrix.shard }} "${specs[@]}"
