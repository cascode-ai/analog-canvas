name: CI

on:
  # A pull request only plans its scope and checks its Test-Impact trailers;
  # its two required checks are skipped, which GitHub counts as passing, so it
  # can enter the merge queue at once.
  pull_request:
  # The merge queue runs the checks once, on the candidate merged with current
  # main: what is tested is what lands, and nobody updates a branch by hand.
  merge_group:
  # Nothing else: no schedule and no full browser audit. Queued groups run the
  # browser specs mapped to their changed paths.

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Change scope
    runs-on: ubuntu-latest
    outputs:
      heavy: ${{ steps.plan.outputs.heavy }}
      browser: ${{ steps.plan.outputs.browser }}
      browser_shards: ${{ steps.plan.outputs.browser_shards }}
      mode: ${{ steps.plan.outputs.mode }}
      e2e_args: ${{ steps.plan.outputs.e2e_args }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Pull requests need their complete commit range for Test-Impact,
          # and a queued group its range from the main it was queued on.
          fetch-depth: 0
      - id: plan
        name: Plan CI validation
        env:
          EVENT_NAME: ${{ github.event_name }}
          PULL_REQUEST_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          MERGE_GROUP_BASE_SHA: ${{ github.event.merge_group.base_sha }}
        shell: bash
        run: |
          base=""
          case "$EVENT_NAME" in
            pull_request)
              base="$PULL_REQUEST_BASE_SHA"
              ;;
            merge_group)
              # Planned by its changed paths like a pull request: the queue
              # re-checks the combination, not the whole suite.
              base="$MERGE_GROUP_BASE_SHA"
              ;;
          esac
          if [[ -z "$base" ]] || ! git rev-parse --verify "$base^{commit}" >/dev/null 2>&1; then
            base="$(git merge-base origin/main HEAD)"
          fi
          node scripts/ci-plan.mjs \
            --base "$base" \
            --github-output \
            --github-summary
      - name: Check test-impact declaration
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
        run: node scripts/check-test-impact.mjs --base "$BASE_SHA"
      - name: Check local Markdown links
        # Core contracts includes this check for implementation changes.
        # Keep it here only so documentation-only PRs still have a gate.
        if: steps.plan.outputs.mode == 'documentation'
        run: node scripts/check-markdown-links.mjs

  core_static:
    name: Core static
    needs: changes
    if: github.event_name == 'merge_group' && needs.changes.outputs.heavy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.16.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Static contracts
        env:
          FORMAT_BASE_SHA: ${{ github.event.merge_group.base_sha }}
        run: pnpm ci:static

  core_build:
    name: Core package build
    needs: changes
    if: github.event_name == 'merge_group' && needs.changes.outputs.heavy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      artifact_id: ${{ steps.shared_build.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.16.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build shared standalone dependencies
        run: node scripts/ci-package-build.mjs build
      - id: shared_build
        uses: actions/upload-artifact@v4
        with:
          name: core-packages-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            packages/*/dist
            output/ci-packages.json
          if-no-files-found: error
          retention-days: 1

  core_unit:
    name: Core unit
    needs: [changes, core_build]
    if: github.event_name == 'merge_group' && needs.changes.outputs.heavy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.16.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.core_build.outputs.artifact_id }}
          merge-multiple: true
      - run: node scripts/ci-package-build.mjs verify
      - name: Unit and integration tests
        env:
          ICM_CI_PACKAGE_BUILD: "1"
        run: pnpm ci:unit

  core_release:
    name: Core release
    needs: [changes, core_build]
    if: github.event_name == 'merge_group' && needs.changes.outputs.heavy == 'true'
    runs-on: ubuntu-latest
    env:
      PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH: /usr/bin/google-chrome
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.16.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.core_build.outputs.artifact_id }}
          merge-multiple: true
      - name: Build remaining workspace packages and applications
        run: node scripts/ci-package-build.mjs remaining
      - name: Release contracts
        # GitHub's Ubuntu image already carries Chrome. Keep setup:e2e as an
        # explicit one-time local command instead of pulling a CI container.
        run: pnpm release:verify:built

  # The packaged Windows preview is accepted when it is released (Desktop
  # preview release), not on every merge: no merge ships it.
  core:
    name: Core contracts
    needs: [changes, core_build, core_static, core_unit, core_release]
    if: always() && github.event_name == 'merge_group' && !(needs.changes.result == 'success' && needs.changes.outputs.heavy == 'false' && needs.changes.outputs.mode == 'documentation')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Require the core suite
        env:
          CORE_NEEDS: ${{ toJSON(needs) }}
        run: node scripts/check-core-results.mjs

  browser_shard:
    name: Browser tests (${{ matrix.shard }})
    needs: changes
    if: github.event_name == 'merge_group' && needs.changes.outputs.browser == 'true'
    runs-on: ubuntu-latest
    env:
      PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH: /usr/bin/google-chrome
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # Broad batches need more parallelism, not a larger per-job timeout.
        shard: ${{ fromJSON(needs.changes.outputs.browser_shards) }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.16.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - env:
          E2E_ARGS: ${{ needs.changes.outputs.e2e_args }}
        run: |
          read -r -a specs <<< "$E2E_ARGS"
          test "${#specs[@]}" -gt 0
          pnpm ci:e2e --workers=3 --shard=${{ matrix.shard }} "${specs[@]}"

  browser:
    name: Browser tests
    needs:
      - changes
      - browser_shard
    if: always() && github.event_name == 'merge_group' && needs.changes.outputs.browser == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Confirm every selected browser shard passed
        env:
          SHARD_RESULT: ${{ needs.browser_shard.result }}
        run: test "$SHARD_RESULT" = "success"
