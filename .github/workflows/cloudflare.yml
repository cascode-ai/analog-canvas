name: Deploy Cloudflare

# Production deploys only from a release (ADR 0057): a v* tag, or a manual
# dispatch naming a commit. Merging to main deploys the preview instead
# (deploy-preview.yml); this workflow promotes a commit the preview has
# already proved. Nothing here can be triggered by an ordinary merge.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      sha:
        description: "Full commit SHA to release; it must have a successful Deploy Preview run"
        required: true
        type: string

permissions:
  contents: read
  # To ask whether the preview deployed this commit.
  actions: read

concurrency:
  group: cloudflare-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Worker
    runs-on: ubuntu-latest
    environment:
      name: cloudflare-production
      url: https://analog-canvas.tokenzhang.com
    steps:
      # A tag names its commit; a dispatch names one explicitly. Everything
      # below deploys exactly that commit, never a branch head.
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.sha || github.ref }}
      # The preview is where a commit is looked at before the public sees it
      # (ADR 0057). A commit that never deployed there, or deployed and
      # failed, cannot be released: this is the one gate between main and
      # the live site, and it asks a question CI cannot answer.
      - name: The release must have a green preview deploy
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_sha="$(git rev-parse 'HEAD^{commit}')"
          count="$(gh run list --repo "$GITHUB_REPOSITORY" \
            --workflow deploy-preview.yml --commit "$release_sha" \
            --status success --json databaseId --jq 'length')"
          if [ "$count" = "0" ]; then
            echo "::error::No successful preview deploy exists for $release_sha. Merge it to main, let the preview deploy and verify it, then release that commit."
            exit 1
          fi
          echo "Preview deploy verified for $release_sha ($count successful run(s))."
      - uses: pnpm/action-setup@v4
        with:
          version: 11.16.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @icm/spice-run build
      - run: pnpm --filter @icm/editor... build
        env:
          # Timing simulation remains a localhost development surface until
          # its interaction and presentation contracts are ready to publish.
          VITE_ICM_TIMING_UI: disabled
      # The version serving right now, captured BEFORE anything changes.
      # Read afterwards it would already describe the deploy under test, and
      # a rollback would restore the very thing it is meant to undo.
      - name: Record the version to roll back to
        id: rollback_target
        run: |
          if ! pnpm dlx wrangler@4.120.1 deployments list --json > /tmp/deployments-before.json; then
            echo "could not list deployments; rollback will be unavailable"
            echo "version_id=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if version_id="$(node scripts/deploy-rollback-target.mjs < /tmp/deployments-before.json)"; then
            echo "version_id=$version_id" >> "$GITHUB_OUTPUT"
            echo "Rollback target: $version_id"
          else
            echo "version_id=" >> "$GITHUB_OUTPUT"
            echo "No rollback target available for this deploy"
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - run: pnpm dlx wrangler@4.120.1 deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # Gallery/auth secrets live in GitHub secrets and are synced to the
      # Worker on every deploy; rotate by updating the GitHub secret and
      # re-running this workflow. Providers without a secret simply stay
      # dark (skipped here, feature invisible on the site). The guard is
      # shell-level because the secrets context is not available in step
      # `if` expressions. GitHub forbids secret names starting with
      # GITHUB_, hence GH_OAUTH_*.
      - name: Sync worker secrets
        run: |
          for name in GH_OAUTH_CLIENT_ID GH_OAUTH_CLIENT_SECRET GOOGLE_CLIENT_ID GOOGLE_CLIENT_SECRET RESEND_API_KEY AUTH_EMAIL_FROM ADMIN_EMAILS ADMIN_EMAILS_EXTRA; do
            value="${!name}"
            if [ -z "$value" ]; then
              echo "$name is not configured; skipping"
              continue
            fi
            printf '%s' "$value" | pnpm dlx wrangler@4.120.1 secret put "$name"
          done
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GH_OAUTH_CLIENT_ID: ${{ secrets.GH_OAUTH_CLIENT_ID }}
          GH_OAUTH_CLIENT_SECRET: ${{ secrets.GH_OAUTH_CLIENT_SECRET }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          AUTH_EMAIL_FROM: ${{ secrets.AUTH_EMAIL_FROM }}
          ADMIN_EMAILS: ${{ secrets.ADMIN_EMAILS }}
          ADMIN_EMAILS_EXTRA: ${{ secrets.ADMIN_EMAILS_EXTRA }}
      - name: Verify production deployment
        id: verify
        run: |
          curl --fail --silent --show-error \
            --retry 5 --retry-delay 2 --retry-all-errors \
            --max-time 20 \
            https://analog-canvas.tokenzhang.com/ >/dev/null
          curl --fail --silent --show-error \
            --retry 5 --retry-delay 2 --retry-all-errors \
            --max-time 20 \
            https://analog-canvas.tokenzhang.com/editor >/dev/null
          curl --fail --silent --show-error \
            --retry 5 --retry-delay 2 --retry-all-errors \
            --max-time 20 \
            https://analog-canvas.tokenzhang.com/analytics >/dev/null
          curl --fail --silent --show-error \
            --retry 5 --retry-delay 2 --retry-all-errors \
            --max-time 20 \
            https://analog-canvas.tokenzhang.com/api/agent/mcp-manifest.json >/dev/null
          # The shell loading proves nothing about the page rendering. On
          # 2026-09-04 a staging deploy took this hostname, and because the
          # asset layer answered `/editor` before the Worker, every path check
          # above passed at 200 while the shell's own script came back
          # 401 "Staging is not public.". The site was blank and the pipeline
          # saw a healthy deployment.
          #
          # So follow the shell to the script it actually asks for, and require
          # JavaScript to come back. This is the narrowest check that tells a
          # page apart from a page-shaped 200.
          shell="$(curl --fail --silent --show-error --max-time 20 \
            https://analog-canvas.tokenzhang.com/editor)"
          entry="$(printf '%s' "$shell" \
            | grep -o '/assets/[A-Za-z0-9._-]*\.js' | head -n 1)"
          if [ -z "$entry" ]; then
            echo "The editor shell references no script; it cannot boot."
            exit 1
          fi
          entry_result="$(curl --silent --output /dev/null --max-time 20 \
            --write-out '%{http_code} %{content_type}' \
            "https://analog-canvas.tokenzhang.com${entry}")"
          case "$entry_result" in
            200*javascript*) : ;;
            401*)
              echo "The live site answered $entry with 401: another Worker"
              echo "holds this domain (on 2026-09-03 it was a staging deploy)."
              echo "Recover by deploying this Worker again, which re-attaches"
              echo "the custom domain."
              exit 1
              ;;
            *)
              echo "The editor's entry script answered: $entry_result"
              exit 1
              ;;
          esac
          stale_asset="$(curl --silent --show-error \
            --max-time 20 \
            --output /tmp/analog-canvas-stale-asset.txt \
            --write-out '%{http_code} %{content_type}' \
            https://analog-canvas.tokenzhang.com/assets/App-deploy-smoke-missing.js)"
          # A hashed asset name is a promise about bytes, so a name with no
          # file behind it must say 404. This check asserted the opposite
          # until #519: it required the shell at 200, which was the bug
          # (#493) written down as the expected answer. The first deploy of
          # the fix was therefore rolled back by this very step, correctly
          # following an instruction that was itself wrong.
          case "$stale_asset" in
            "404 "*)
              ;;
            *)
              echo "A missing hashed asset must answer 404, got: $stale_asset"
              cat /tmp/analog-canvas-stale-asset.txt
              exit 1
              ;;
          esac
          # The other half of the boundary: a client route has no file behind
          # it either, and must still receive the shell rather than a 404.
          route_shell="$(curl --silent --show-error \
            --max-time 20 \
            --output /tmp/analog-canvas-route-shell.txt \
            --write-out '%{http_code} %{content_type}' \
            https://analog-canvas.tokenzhang.com/editor)"
          case "$route_shell" in
            "200 text/html"*)
              grep -qi '<!doctype html>' /tmp/analog-canvas-route-shell.txt
              ;;
            *)
              echo "A client route must receive the shell, got: $route_shell"
              exit 1
              ;;
          esac

      # Detection without recovery is what turned a bad deploy into twenty
      # minutes of 500s: the pipeline saw them, went red, and left production
      # broken. This restores the previous version instead, then proves the
      # restore worked. The job still fails, loudly — a rollback is a recovery,
      # never a pass.
      - name: Roll back a failed deployment
        if: failure() && steps.verify.outcome == 'failure'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ROLLBACK_VERSION: ${{ steps.rollback_target.outputs.version_id }}
        run: |
          if [ -z "$ROLLBACK_VERSION" ]; then
            echo "::error::Verification failed and no rollback target was recorded. Production is serving the failed deploy and needs a human."
            exit 1
          fi
          echo "::warning::Verification failed; rolling back to $ROLLBACK_VERSION"
          pnpm dlx wrangler@4.120.1 rollback "$ROLLBACK_VERSION" \
            --yes --message "Automatic rollback: post-deploy verification failed for ${GITHUB_SHA}"
          # A rollback that is not re-verified is a second unchecked deploy.
          # These are the same paths the verification step checks, and the
          # editor is among them because that is what broke.
          for path in / /editor /analytics /api/agent/mcp-manifest.json; do
            if ! curl --fail --silent --show-error \
              --retry 10 --retry-delay 3 --retry-all-errors --max-time 20 \
              "https://analog-canvas.tokenzhang.com${path}" >/dev/null; then
              echo "::error::Rollback to $ROLLBACK_VERSION did not restore ${path}. Production is down and needs a human."
              exit 1
            fi
          done
          echo "::error::Deploy of ${GITHUB_SHA} failed verification and was rolled back to $ROLLBACK_VERSION. Production is serving the previous version."
          exit 1
