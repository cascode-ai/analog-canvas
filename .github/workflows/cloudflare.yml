name: Deploy Cloudflare

# Production (Deployment rationale) has two entrances:
# - a merge to main whose pull request does not carry the `preview` label
#   builds that merge commit once and deploys it directly;
# - a v* tag, or a manual dispatch selecting a ref on main, promotes a commit
#   whose Preview deploy succeeded, using the exact candidate Preview accepted.
# A merge labeled `preview` stays on Preview (deploy-preview.yml) until it is
# promoted here. Either entrance ends in the same verification and rollback.
on:
  push:
    branches:
      - main
    tags:
      - "v*"
    # Path filters are not evaluated for tag pushes.
    paths-ignore:
      - "**/*.md"
      - "docs/**"
  workflow_dispatch:
    inputs:
      ref:
        description: "Accepted Git ref to release"
        required: false
        default: "main"
        type: string

permissions:
  contents: read
  # To ask whether the preview deployed this commit.
  actions: read
  # To read the merged pull request's labels.
  pull-requests: read

concurrency:
  group: cloudflare-production
  cancel-in-progress: false

jobs:
  # Deploy an unlabeled merge directly; a merge labeled `preview` waits on
  # Preview. A lookup that keeps failing fails this job instead of guessing.
  route:
    name: Release route
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      target: ${{ steps.route.outputs.target }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - id: route
        name: Choose Preview or Production
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release-route.mjs --sha "$GITHUB_SHA" --github-output

  deploy:
    name: Deploy Worker
    needs: route
    if: >-
      ${{ !cancelled() && (
        github.event_name == 'workflow_dispatch' ||
        startsWith(github.ref, 'refs/tags/') ||
        (needs.route.result == 'success' &&
          needs.route.outputs.target == 'production')
      ) }}
    runs-on: ubuntu-latest
    environment:
      name: cloudflare-production
      url: https://analog-canvas.tokenzhang.com
    env:
      DIRECT_RELEASE: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    steps:
      # A merge or tag names its commit; a dispatch resolves its selected ref
      # once. Everything below deploys exactly that commit, never a moving
      # branch head.
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
          # The main history proves a promoted commit was merged.
          fetch-depth: 0
      - name: Resolve the release commit
        id: release
        run: |
          release_sha="$(git rev-parse 'HEAD^{commit}')"
          if [ "$DIRECT_RELEASE" != "true" ] &&
            ! git merge-base --is-ancestor "$release_sha" origin/main; then
            echo "::error::$release_sha is not on main. Merge it first; only merged commits are released."
            exit 1
          fi
          echo "release_sha=$release_sha" >> "$GITHUB_OUTPUT"
      # A promoted commit was looked at on Preview before the public sees it
      # (Deployment rationale). A commit that never deployed there, or deployed and
      # failed, cannot be promoted.
      - name: The release must have a green preview deploy
        if: env.DIRECT_RELEASE != 'true'
        id: preview
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ steps.release.outputs.release_sha }}
        run: |
          run_id="$(gh run list --repo "$GITHUB_REPOSITORY" \
            --workflow deploy-preview.yml --commit "$RELEASE_SHA" \
            --status success --limit 100 --json databaseId,createdAt \
            --jq 'sort_by(.createdAt) | last | .databaseId // empty')"
          if [ -z "$run_id" ]; then
            echo "::error::No successful preview deploy exists for $RELEASE_SHA. Label its pull request preview, or run Deploy Preview on main, then release that commit."
            exit 1
          fi
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "Preview deploy $run_id accepted $RELEASE_SHA."
      - name: Download the accepted Preview candidate
        if: env.DIRECT_RELEASE != 'true'
        uses: actions/download-artifact@v4
        with:
          name: preview-candidate-${{ steps.release.outputs.release_sha }}
          path: ${{ runner.temp }}/analog-canvas-candidate
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.preview.outputs.run_id }}
      - uses: pnpm/action-setup@v4
        with:
          version: 11.16.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      # A direct release builds the merged commit once, with the same action
      # Preview uses, and deploys exactly those bytes.
      - name: Build the merged commit's deployment candidate
        if: env.DIRECT_RELEASE == 'true'
        uses: ./.github/actions/build-deployment-candidate
        with:
          wrangler-config: wrangler.jsonc
          release-sha: ${{ steps.release.outputs.release_sha }}
          candidate-dir: ${{ runner.temp }}/analog-canvas-candidate
      - name: Verify the deployment candidate
        run: |
          node scripts/deployment-candidate.mjs verify \
            "$CANDIDATE_DIR" "${{ steps.release.outputs.release_sha }}"
        env:
          CANDIDATE_DIR: ${{ runner.temp }}/analog-canvas-candidate
      - name: Require the released simulator credentials
        run: test -n "$SIMULATION_UPSTREAM_TOKEN"
        env:
          SIMULATION_UPSTREAM_TOKEN: ${{ secrets.SIMULATION_UPSTREAM_TOKEN }}
      - name: Reconcile production simulation resources
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          wrangler="pnpm dlx wrangler@4.120.1"
          ensure_queue() {
            name="$1"
            retention="$2"
            $wrangler queues update "$name" --message-retention-period-secs "$retention" && return
            $wrangler queues create "$name" --message-retention-period-secs "$retention" && return
            $wrangler queues update "$name" --message-retention-period-secs "$retention"
          }
          ensure_queue analog-canvas-simulation-production 900
          ensure_queue analog-canvas-simulation-production-dlq 604800
          bucket=analog-canvas-simulation-artifacts-production
          if ! $wrangler r2 bucket info "$bucket" >/dev/null 2>&1; then
            $wrangler r2 bucket create "$bucket" || $wrangler r2 bucket info "$bucket" >/dev/null
          fi
          if ! $wrangler r2 bucket lifecycle list "$bucket" | grep -Fq simulation-artifact-retention; then
            $wrangler r2 bucket lifecycle add "$bucket" simulation-artifact-retention --expire-days 1 --force
          fi
      # The version serving right now, captured BEFORE anything changes.
      # Read afterwards it would already describe the deploy under test, and
      # a rollback would restore the very thing it is meant to undo.
      - name: Record the version to roll back to
        id: rollback_target
        run: |
          if ! pnpm dlx wrangler@4.120.1 deployments list --json > /tmp/deployments-before.json; then
            echo "could not list deployments; rollback will be unavailable"
            echo "version_id=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if version_id="$(node scripts/deploy-rollback-target.mjs < /tmp/deployments-before.json)"; then
            echo "version_id=$version_id" >> "$GITHUB_OUTPUT"
            echo "Rollback target: $version_id"
          else
            echo "version_id=" >> "$GITHUB_OUTPUT"
            echo "No rollback target available for this deploy"
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Verify the pinned MCP release before deployment
        run: node scripts/verify-agent-manifest.mjs --asset-only
      - name: Deploy the verified candidate
        id: deploy_worker
        run: |
          pnpm dlx wrangler@4.120.1 deploy \
            "$CANDIDATE_DIR/worker/index.js" \
            --config wrangler.jsonc \
            --no-bundle \
            --assets "$CANDIDATE_DIR/editor"
        env:
          CANDIDATE_DIR: ${{ runner.temp }}/analog-canvas-candidate
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # Gallery/auth secrets live in GitHub secrets and are synced to the
      # Worker on every deploy; rotate by updating the GitHub secret and
      # re-running this workflow. Providers without a secret simply stay
      # dark (skipped here, feature invisible on the site). The guard is
      # shell-level because the secrets context is not available in step
      # `if` expressions. GitHub forbids secret names starting with
      # GITHUB_, hence GH_OAUTH_*.
      - name: Sync worker secrets
        run: |
          for name in GH_OAUTH_CLIENT_ID GH_OAUTH_CLIENT_SECRET GOOGLE_CLIENT_ID GOOGLE_CLIENT_SECRET RESEND_API_KEY AUTH_EMAIL_FROM ADMIN_EMAILS ADMIN_EMAILS_EXTRA SIMULATION_UPSTREAM_TOKEN; do
            value="${!name}"
            if [ -z "$value" ]; then
              echo "$name is not configured; skipping"
              continue
            fi
            printf '%s' "$value" | pnpm dlx wrangler@4.120.1 secret put "$name"
          done
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GH_OAUTH_CLIENT_ID: ${{ secrets.GH_OAUTH_CLIENT_ID }}
          GH_OAUTH_CLIENT_SECRET: ${{ secrets.GH_OAUTH_CLIENT_SECRET }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          AUTH_EMAIL_FROM: ${{ secrets.AUTH_EMAIL_FROM }}
          ADMIN_EMAILS: ${{ secrets.ADMIN_EMAILS }}
          ADMIN_EMAILS_EXTRA: ${{ secrets.ADMIN_EMAILS_EXTRA }}
          SIMULATION_UPSTREAM_TOKEN: ${{ secrets.SIMULATION_UPSTREAM_TOKEN }}
      - name: Verify production deployment
        id: verify
        env:
          CANDIDATE_DIR: ${{ runner.temp }}/analog-canvas-candidate
        run: |
          curl --fail --silent --show-error \
            --retry 5 --retry-delay 2 --retry-all-errors \
            --max-time 20 \
            https://analog-canvas.tokenzhang.com/ >/dev/null
          curl --fail --silent --show-error \
            --retry 5 --retry-delay 2 --retry-all-errors \
            --max-time 20 \
            https://analog-canvas.tokenzhang.com/editor >/dev/null
          curl --fail --silent --show-error \
            --retry 5 --retry-delay 2 --retry-all-errors \
            --max-time 20 \
            https://analog-canvas.tokenzhang.com/analytics >/dev/null
          curl --fail --silent --show-error \
            --retry 5 --retry-delay 2 --retry-all-errors \
            --max-time 20 \
            https://analog-canvas.tokenzhang.com/api/agent/mcp-manifest.json >/dev/null
          # Asset integrity was verified before deploying. Now check only
          # that the serving domain advertises the accepted declaration.
          node scripts/verify-agent-manifest.mjs https://analog-canvas.tokenzhang.com --manifest-only
          agent_session="$(curl --fail --silent --show-error \
            --retry 5 --retry-delay 2 --retry-all-errors \
            --max-time 20 \
            -H 'content-type: application/json' \
            --data '{"projectSessionId":"production-smoke","projectId":"production-smoke","documentIds":["main"],"scopes":["circuit.snapshot"]}' \
            https://analog-canvas.tokenzhang.com/api/agent/sessions)"
          agent_session_id="$(printf '%s' "$agent_session" | jq -er '.session.sessionId')"
          agent_editor_secret="$(printf '%s' "$agent_session" | jq -er '.session.editorSecret')"
          agent_delete="$(curl --silent --show-error --max-time 20 \
            --output /dev/null --write-out '%{http_code}' \
            -X DELETE -H "x-editor-secret: $agent_editor_secret" \
            "https://analog-canvas.tokenzhang.com/api/agent/sessions/$agent_session_id")"
          if [ "$agent_delete" != "204" ]; then
            echo "Production Agent session cleanup answered $agent_delete"
            exit 1
          fi
          # The shell loading proves nothing about the page rendering. On
          # 2026-09-04 a staging deploy took this hostname, and because the
          # asset layer answered `/editor` before the Worker, every path check
          # above passed at 200 while the shell's own script came back
          # 401 "Staging is not public.". The site was blank and the pipeline
          # saw a healthy deployment.
          #
          # So follow the shell to the script it actually asks for, and require
          # JavaScript to come back. This is the narrowest check that tells a
          # page apart from a page-shaped 200.
          shell="$(curl --fail --silent --show-error --max-time 20 \
            https://analog-canvas.tokenzhang.com/editor)"
          entry="$(printf '%s' "$shell" \
            | grep -o '/assets/[A-Za-z0-9._-]*\.js' | head -n 1)"
          if [ -z "$entry" ]; then
            echo "The editor shell references no script; it cannot boot."
            exit 1
          fi
          entry_result="$(curl --silent --output /dev/null --max-time 20 \
            --write-out '%{http_code} %{content_type}' \
            "https://analog-canvas.tokenzhang.com${entry}")"
          case "$entry_result" in
            200*javascript*) : ;;
            401*)
              echo "The live site answered $entry with 401: another Worker"
              echo "holds this domain (on 2026-09-03 it was a staging deploy)."
              echo "Recover by deploying this Worker again, which re-attaches"
              echo "the custom domain."
              exit 1
              ;;
            *)
              echo "The editor's entry script answered: $entry_result"
              exit 1
              ;;
          esac
          stale_asset="$(curl --silent --show-error \
            --max-time 20 \
            --output /tmp/analog-canvas-stale-asset.txt \
            --write-out '%{http_code} %{content_type}' \
            https://analog-canvas.tokenzhang.com/assets/App-deploy-smoke-missing.js)"
          # A hashed asset name is a promise about bytes, so a name with no
          # file behind it must say 404. This check asserted the opposite
          # until #519: it required the shell at 200, which was the bug
          # (#493) written down as the expected answer. The first deploy of
          # the fix was therefore rolled back by this very step, correctly
          # following an instruction that was itself wrong.
          case "$stale_asset" in
            "404 "*)
              ;;
            *)
              echo "A missing hashed asset must answer 404, got: $stale_asset"
              cat /tmp/analog-canvas-stale-asset.txt
              exit 1
              ;;
          esac
          # The other half of the boundary: a client route has no file behind
          # it either, and must still receive the shell rather than a 404.
          route_shell="$(curl --silent --show-error \
            --max-time 20 \
            --output /tmp/analog-canvas-route-shell.txt \
            --write-out '%{http_code} %{content_type}' \
            https://analog-canvas.tokenzhang.com/editor)"
          case "$route_shell" in
            "200 text/html"*)
              grep -qi '<!doctype html>' /tmp/analog-canvas-route-shell.txt
              ;;
            *)
              echo "A client route must receive the shell, got: $route_shell"
              exit 1
              ;;
          esac

          node scripts/deployment-candidate.mjs verify-live \
            "$CANDIDATE_DIR" https://analog-canvas.tokenzhang.com
          # A promoted candidate already passed Preview's hosted qualification;
          # a direct release relies on the pull request's required checks.
          # Either way Production proves that its own route can execute OP,
          # TRAN, DC and Noise, using no installed workspace package.
          node scripts/preview-simulation-smoke.mjs \
            https://analog-canvas.tokenzhang.com --production-smoke
          # Preview already accepted the public MCP/managed-queue journey.
          # Promotion intentionally does not install workspace dependencies,
          # so prove Production's two direct Profile routes with Node alone.
          node scripts/production-dual-engine-smoke.mjs \
            https://analog-canvas.tokenzhang.com

      # Detection without recovery is what turned a bad deploy into twenty
      # minutes of 500s: the pipeline saw them, went red, and left production
      # broken. This restores the previous version instead, then proves the
      # restore worked. The job still fails, loudly — a rollback is a recovery,
      # never a pass.
      - name: Roll back a failed deployment
        if: failure() && steps.deploy_worker.outcome == 'success'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ROLLBACK_VERSION: ${{ steps.rollback_target.outputs.version_id }}
        run: |
          if [ -z "$ROLLBACK_VERSION" ]; then
            echo "::error::Verification failed and no rollback target was recorded. Production is serving the failed deploy and needs a human."
            exit 1
          fi
          echo "::warning::Verification failed; rolling back to $ROLLBACK_VERSION"
          pnpm dlx wrangler@4.120.1 rollback "$ROLLBACK_VERSION" \
            --yes --message "Automatic rollback: post-deploy verification failed for ${GITHUB_SHA}"
          # A rollback that is not re-verified is a second unchecked deploy.
          # These are the same paths the verification step checks, and the
          # editor is among them because that is what broke.
          for path in / /editor /analytics /api/agent/mcp-manifest.json; do
            if ! curl --fail --silent --show-error \
              --retry 10 --retry-delay 3 --retry-all-errors --max-time 20 \
              "https://analog-canvas.tokenzhang.com${path}" >/dev/null; then
              echo "::error::Rollback to $ROLLBACK_VERSION did not restore ${path}. Production is down and needs a human."
              exit 1
            fi
          done
          echo "::error::Deploy of ${GITHUB_SHA} failed verification and was rolled back to $ROLLBACK_VERSION. Production is serving the previous version."
          exit 1
