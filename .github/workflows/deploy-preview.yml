name: Deploy Preview

# The preview channel (ADR 0057): every merge to main deploys the preview
# Worker at analog-canvas-preview.tokenzhang.com and verifies it. Production
# is a different workflow with a different trigger; nothing here can reach it.
on:
  push:
    branches:
      - main
    paths-ignore:
      - "**/*.md"
      - "docs/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-preview
  cancel-in-progress: false

env:
  PREVIEW_URL: https://analog-canvas-preview.tokenzhang.com

jobs:
  preview:
    name: Deploy preview
    runs-on: ubuntu-latest
    environment:
      name: cloudflare-preview
      url: https://analog-canvas-preview.tokenzhang.com
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.16.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @icm/spice-run build
      - run: pnpm --filter @icm/editor... build
        env:
          VITE_ICM_TIMING_UI: disabled
      - name: Deploy to preview
        run: pnpm dlx wrangler@4.120.1 deploy --config wrangler.preview.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # The token the operator-run simulator host requires (worker/simulation.ts,
      # SIMULATION_UPSTREAM_TOKEN). A Worker secret outlives deploys, so setting
      # it every time is idempotent; with no repository secret the step is
      # skipped and the deployment keeps whatever it had.
      - name: Give the Worker the simulator host's token
        if: env.SIMULATION_UPSTREAM_TOKEN != ''
        run: |
          printf '%s' "$SIMULATION_UPSTREAM_TOKEN" \
            | pnpm dlx wrangler@4.120.1 secret put SIMULATION_UPSTREAM_TOKEN --config wrangler.preview.jsonc
        env:
          SIMULATION_UPSTREAM_TOKEN: ${{ secrets.SIMULATION_UPSTREAM_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # What a preview is for: the page renders, the gallery reads and never
      # writes, nothing is indexed, and the simulator answers.
      - name: Verify preview
        run: |
          set -euo pipefail
          # The custom domain is created by the deploy; the first one took a
          # few minutes to resolve, and every check below needs the name.
          for _ in $(seq 1 60); do
            if curl --silent --output /dev/null --max-time 10 "${PREVIEW_URL}/api/channel"; then
              break
            fi
            sleep 5
          done
          channel="$(curl --fail --silent --show-error --max-time 20 \
            --retry 5 --retry-delay 2 --retry-all-errors \
            "${PREVIEW_URL}/api/channel")"
          case "$channel" in
            *'"preview"'*) ;;
            *) echo "The preview does not know it is the preview: $channel"; exit 1 ;;
          esac
          # The shell and its hashed entry script come from one build, but the
          # edge does not switch them in the same instant: right after a
          # deploy it served the previous shell (a cache HIT) whose script the
          # new deployment had already replaced, and the check read 404 for a
          # preview that was healthy a minute later (2026-09-04, #618). So the
          # pair is read together and re-read until they agree, for up to two
          # minutes; a real mismatch still fails, just not on the first look.
          entry_result=""
          for _ in $(seq 1 12); do
            shell="$(curl --fail --silent --show-error --max-time 20 \
              -H 'Cache-Control: no-cache' "${PREVIEW_URL}/editor")"
            entry="$(printf '%s' "$shell" | grep -o '/assets/[A-Za-z0-9._-]*\.js' | head -n 1)"
            if [ -z "$entry" ]; then
              echo "The editor shell references no script; it cannot boot."
              exit 1
            fi
            entry_result="$(curl --silent --output /dev/null --max-time 20 \
              --write-out '%{http_code} %{content_type}' "${PREVIEW_URL}${entry}")"
            case "$entry_result" in
              200*javascript*) break ;;
              *) echo "Entry script ${entry} answered ${entry_result}; waiting for the edge to catch up"; sleep 10 ;;
            esac
          done
          case "$entry_result" in
            200*javascript*) ;;
            *) echo "The editor's entry script answered: $entry_result"; exit 1 ;;
          esac
          stale="$(curl --silent --output /dev/null --max-time 20 \
            --write-out '%{http_code}' "${PREVIEW_URL}/assets/App-preview-smoke-missing.js")"
          if [ "$stale" != "404" ]; then
            echo "A missing hashed asset must answer 404, got: $stale"
            exit 1
          fi
          robots="$(curl --fail --silent --show-error --max-time 20 "${PREVIEW_URL}/robots.txt")"
          case "$robots" in
            *"Disallow: /"*) ;;
            *) echo "The preview must refuse robots, got: $robots"; exit 1 ;;
          esac
          noindex="$(curl --silent --head --max-time 20 "${PREVIEW_URL}/editor" | tr -d '\r' | grep -i '^x-robots-tag:' || true)"
          case "$noindex" in
            *noindex*) ;;
            *) echo "Preview responses must carry noindex, got: ${noindex:-nothing}"; exit 1 ;;
          esac
          gallery="$(curl --silent --output /dev/null --max-time 20 \
            --write-out '%{http_code}' "${PREVIEW_URL}/api/gallery")"
          if [ "$gallery" != "200" ]; then
            echo "The preview must read the production gallery, got: $gallery"
            exit 1
          fi
          write="$(curl --silent --output /dev/null --max-time 20 -X POST \
            --write-out '%{http_code}' "${PREVIEW_URL}/api/gallery/preview-smoke/like")"
          if [ "$write" != "403" ]; then
            echo "A gallery write on the preview must be refused, got: $write"
            exit 1
          fi
      # The divider runs on the preview's simulator host, and the answer has
      # to be a number with a measured environment identity behind it, not a
      # green status.
      - name: Simulate one circuit on the preview's simulator host
        run: node scripts/preview-simulation-smoke.mjs "$PREVIEW_URL"
