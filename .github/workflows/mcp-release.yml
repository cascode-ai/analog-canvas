name: Publish MCP

on:
  workflow_dispatch:
    inputs:
      package_only:
        description: Build an unpublished candidate and record its digest
        type: boolean
        default: false
      prerelease:
        description: Publish a Preview-only GitHub prerelease, never npm or Latest
        type: boolean
        default: false

permissions:
  contents: write
  id-token: write

concurrency:
  group: mcp-release
  cancel-in-progress: false

jobs:
  publish:
    name: Package and publish MCP
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.16.0
      - uses: actions/setup-node@v4
        with:
          # npm pack metadata is part of the immutable tarball digest.
          node-version: 24.20.0
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - if: inputs.package_only
        run: pnpm mcp:package
      - if: ${{ !inputs.package_only }}
        run: pnpm mcp:release:package
      # Candidate builds compute the digest before distribution validation.
      # Published builds must match the committed digest and never restamp it.
      - if: inputs.package_only
        run: pnpm mcp:release:bump -- --stamp
      - run: pnpm mcp:distribution:check
      - uses: actions/upload-artifact@v4
        with:
          name: mcp-candidate-${{ github.sha }}
          path: output/mcp/*.*
          if-no-files-found: error
      - name: Read release declaration
        id: distribution
        shell: bash
        run: |
          node -e 'const d = require("./config/agent-mcp-distribution.json"); console.log("tag=" + d.release.tag); console.log("version=" + d.version)' >> "$GITHUB_OUTPUT"
      - name: Publish npm package when credentials are configured
        if: ${{ !inputs.package_only && !inputs.prerelease }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          PACKAGE_NAME: "@analog-canvas/mcp-server"
          VERSION: ${{ steps.distribution.outputs.version }}
        shell: bash
        run: |
          if [[ -z "$NODE_AUTH_TOKEN" ]]; then
            echo "NPM_TOKEN is not configured; GitHub Release is the active distribution."
            exit 0
          fi
          if npm view "$PACKAGE_NAME@$VERSION" version >/dev/null 2>&1; then
            echo "$PACKAGE_NAME@$VERSION is already published."
            exit 0
          fi
          npm publish "output/mcp/analog-canvas-mcp-server-$VERSION.tgz" --access public --provenance
      - name: Publish immutable GitHub Release
        if: ${{ !inputs.package_only }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.distribution.outputs.tag }}
          VERSION: ${{ steps.distribution.outputs.version }}
          PRERELEASE: ${{ inputs.prerelease }}
        shell: bash
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; refusing to replace immutable assets."
            exit 1
          fi
          flags=()
          if [[ "$PRERELEASE" == "true" ]]; then
            flags+=(--prerelease --latest=false)
          fi
          gh release create "$TAG" "${flags[@]}" \
            "output/mcp/analog-canvas-mcp-server-$VERSION.tgz" \
            "output/mcp/SHA256SUMS.txt" \
            "output/mcp/mcp-bootstrap-release.json" \
            --target "$GITHUB_SHA" \
            --title "Analog Canvas MCP $VERSION" \
            --notes "Versioned local stdio MCP adapter for Analog Canvas. The package embeds its execution instructions and MCP Resources."
