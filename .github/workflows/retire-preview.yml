name: Retire hosted Preview

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-preview-retirement
  cancel-in-progress: false

jobs:
  retire:
    name: Make Preview dormant
    runs-on: ubuntu-latest
    environment: cloudflare-preview
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.16.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build Worker dependencies
        run: pnpm build
      - name: Resolve the Cloudflare account
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CONFIGURED_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          account_id="$CONFIGURED_ACCOUNT_ID"
          if [ -z "$account_id" ]; then
            accounts="$(curl --fail --silent --show-error \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              'https://api.cloudflare.com/client/v4/accounts?per_page=2')"
            account_id="$(printf '%s' "$accounts" | jq -er \
              'if (.result | length) == 1 then .result[0].id else error("Cloudflare account is ambiguous") end')"
          fi
          echo "CLOUDFLARE_ACCOUNT_ID=$account_id" >> "$GITHUB_ENV"
      - name: Deploy the route-free storage authority
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: pnpm dlx wrangler@4.120.1 deploy --config wrangler.preview.jsonc
      - name: Detach the Preview custom domain
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          PREVIEW_HOST: analog-canvas-preview.tokenzhang.com
        run: |
          set -euo pipefail
          domains="$(curl --fail --silent --show-error \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/domains")"
          domain_id="$(printf '%s' "$domains" | jq -r --arg host "$PREVIEW_HOST" \
            '.result[] | select(.hostname == $host) | .id' | head -n 1)"
          if [ -n "$domain_id" ]; then
            curl --fail --silent --show-error -X DELETE \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/domains/$domain_id" \
              | jq -e '.success' >/dev/null
          fi
          remaining="$(curl --fail --silent --show-error \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/domains")"
          if printf '%s' "$remaining" | jq -e --arg host "$PREVIEW_HOST" \
            '.result[] | select(.hostname == $host)' >/dev/null; then
            echo "::error::$PREVIEW_HOST is still attached to a Worker"
            exit 1
          fi
      - name: Verify Preview is offline and storage resources remain
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          if curl --silent --show-error --max-time 15 \
            https://analog-canvas-preview.tokenzhang.com/api/channel \
            | jq -e '.channel == "preview"' >/dev/null 2>&1; then
            echo "::error::Preview is still publicly reachable"
            exit 1
          fi
          pnpm dlx wrangler@4.120.1 r2 bucket info \
            analog-canvas-simulation-artifacts-preview >/dev/null
          queues="$(curl --fail --silent --show-error \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/queues")"
          printf '%s' "$queues" | jq -e \
            '.result | map(.queue_name) | index("analog-canvas-simulation-preview") != null' \
            >/dev/null
          printf '%s' "$queues" | jq -e \
            '.result | map(.queue_name) | index("analog-canvas-simulation-preview-dlq") != null' \
            >/dev/null
          pnpm dlx wrangler@4.120.1 deployments list \
            --config wrangler.preview.jsonc >/dev/null
