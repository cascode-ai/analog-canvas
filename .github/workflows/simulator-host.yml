# The operator-run simulator host (docs/deployment.md, "Where the simulator
# runs"). Manual actions behind one switch, plus an automatic rebuild when
# the harness changes on main:
#
#   probe             what the Cloudflare token may do, as HTTP statuses only
#   bootstrap-tunnel  create the named tunnel, its ingress, and the DNS name;
#                     hand the connector token to the host over SSH; verify
#   deploy            copy the harness and shared runtime to the host, rebuild, restart,
#                     and verify /health through the tunnel
#   authorize-ssh-key add a new CI public key next to the one in use, with the
#                     same authorized_keys options, and remember the one in use
#   retire-ssh-key    once SIM_HOST_SSH_KEY holds the new key, remove the
#                     remembered one (the run proves the new key logs in)
#
# Nothing here prints a secret: the tunnel token goes straight from the
# Cloudflare API into tunnel.env on the host through the SSH session.
name: Simulator host

on:
  workflow_dispatch:
    inputs:
      action:
        description: What to do on the host
        required: true
        default: probe
        type: choice
        options:
          [
            probe,
            bootstrap-tunnel,
            deploy,
            authorize-ssh-key,
            retire-ssh-key,
          ]
      public_key:
        description: authorize-ssh-key only — the new CI key's one-line ssh-ed25519 public key
        type: string
  push:
    branches: [main]
    paths:
      - containers/ngspice/**
      - containers/simulation/**
      - packages/spice-run/**
      - packages/simulation-service/src/execution-receipt.ts
      - scripts/package-ngspice-harness.mjs
      # Workflow-only qualification edits do not restart the host. Use the
      # explicit deploy action when changing host orchestration itself.

concurrency:
  group: simulator-host
  cancel-in-progress: false

permissions:
  contents: read

env:
  # The tunnel's public name and the name of the tunnel object itself.
  SIM_HOSTNAME: sim-fra.analog-canvas.tokenzhang.com
  SIM_ZONE: tokenzhang.com
  TUNNEL_NAME: analog-canvas-sim-fra
  # Where the harness answers inside the host's internal Docker network.
  SIM_SERVICE: http://analog-canvas-ngspice:8080

jobs:
  host:
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && contains(fromJSON('["probe", "bootstrap-tunnel", "deploy"]'), inputs.action))
    name: ${{ github.event_name == 'push' && 'deploy' || inputs.action }}
    runs-on: ubuntu-latest
    # The account id and the deploy token live in this environment's secrets,
    # as the preview deploy reads them; without it CLOUDFLARE_ACCOUNT_ID is
    # empty and every account-scoped request routes to /accounts//… (7003).
    environment: cloudflare-preview
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.16.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Package the shared ngspice result runtime
        if: github.event_name == 'push' || inputs.action != 'probe'
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter @icm/simulation-service... build
          node scripts/package-ngspice-harness.mjs

      - name: Reach the host over SSH
        env:
          SIM_HOST_SSH_KEY: ${{ secrets.SIM_HOST_SSH_KEY }}
          SIM_HOST_KNOWN_HOSTS: ${{ secrets.SIM_HOST_KNOWN_HOSTS }}
          SIM_HOST_ADDR: ${{ secrets.SIM_HOST_ADDR }}
          SIM_HOST_USER: ${{ secrets.SIM_HOST_USER }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SIM_HOST_SSH_KEY" > ~/.ssh/sim_host && chmod 600 ~/.ssh/sim_host
          printf '%s\n' "$SIM_HOST_KNOWN_HOSTS" > ~/.ssh/known_hosts
          cat > ~/.ssh/config <<CFG
          Host sim
            HostName $SIM_HOST_ADDR
            User $SIM_HOST_USER
            IdentityFile ~/.ssh/sim_host
            IdentitiesOnly yes
            BatchMode yes
            ConnectTimeout 20
          CFG
          ssh sim 'echo "host reachable: $(hostname)"; docker ps --format "{{.Names}} {{.Status}}" | sed "s/^/  /"'
          # Read-only capacity evidence before considering a second executor.
          # Never stop the shared ngspice service to make a candidate fit.
          ssh sim 'free -m; df -h /; printf "logical CPUs: "; nproc'

      - name: Probe what the Cloudflare token may do
        if: github.event_name == 'workflow_dispatch' && inputs.action == 'probe'
        env:
          # A token of its own for the tunnel and the DNS name — the deploy
          # token can see the zone but may not touch tunnels or records, and
          # widening it would widen every deploy. Falls back to the deploy
          # token so the probe can still say what that one may do.
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_TUNNEL_API_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          api() { curl --silent --output /dev/null --write-out '%{http_code}' -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$@"; }
          base=https://api.cloudflare.com/client/v4
          # The account id secret has been empty since it was made — wrangler
          # never needed it, a token that sees one account implies it — so the
          # token's own view of its accounts is the source when the secret is.
          account_id="${CLOUDFLARE_ACCOUNT_ID:-$(curl --silent -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$base/accounts?per_page=2" | jq -r 'if (.result | length) == 1 then .result[0].id else empty end')}"
          echo "account id:    ${account_id:-(none: the secret is empty and the token does not see exactly one account)}"
          echo "token verify:  $(api "$base/user/tokens/verify")"
          echo "list tunnels:  $(api "$base/accounts/$account_id/cfd_tunnel?per_page=1")"
          echo "list zones:    $(api "$base/zones?name=$SIM_ZONE")"
          zone="$(curl --silent -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$base/zones?name=$SIM_ZONE" | jq -r '.result[0].id // empty')"
          if [ -n "$zone" ]; then
            echo "list dns:      $(api "$base/zones/$zone/dns_records?per_page=1")"
          else
            echo "list dns:      (zone not visible to this token)"
          fi

      - name: Install the tracked host lifecycle bundle
        if: github.event_name == 'push' || inputs.action != 'probe'
        env:
          SIMULATION_ACCESS_TOKEN: ${{ secrets.SIMULATION_UPSTREAM_TOKEN }}
        run: |
          set -euo pipefail
          [ -n "$SIMULATION_ACCESS_TOKEN" ] || { echo "::error::SIMULATION_UPSTREAM_TOKEN is empty"; exit 1; }
          release="analog-canvas-sim/releases/$GITHUB_SHA"
          ssh sim "rm -rf ~/$release && mkdir -p ~/$release"
          tar -cf - containers/ngspice containers/simulation | ssh sim "tar -xf - -C ~/$release"
          printf '%s\n' "$GITHUB_SHA" | ssh sim "cat > ~/$release/SOURCE_COMMIT"
          ssh sim "chmod 755 ~/$release/containers/ngspice/host/*.sh ~/$release/containers/ngspice/verify-host-runtime.sh"
          ssh sim "~/$release/containers/ngspice/host/bootstrap.sh"
          # The access token travels over SSH on stdin and is never an
          # argument, a log line, or a file in the checkout.
          printf '%s' "$SIMULATION_ACCESS_TOKEN" | ssh sim 'umask 077; { printf "SIMULATION_ACCESS_TOKEN="; cat; printf "\n"; } > ~/analog-canvas-sim/secrets/runtime.env'

      - name: Create the tunnel, its ingress, and its DNS name; hand the token to the host
        if: github.event_name == 'workflow_dispatch' && inputs.action == 'bootstrap-tunnel'
        env:
          # A token of its own for the tunnel and the DNS name — the deploy
          # token can see the zone but may not touch tunnels or records, and
          # widening it would widen every deploy. Falls back to the deploy
          # token so the probe can still say what that one may do.
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_TUNNEL_API_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          base=https://api.cloudflare.com/client/v4
          auth=(-H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "content-type: application/json")
          fail() { echo "::error::$1"; echo "$2" | jq -c '{success, errors}' || true; exit 1; }
          account_id="${CLOUDFLARE_ACCOUNT_ID:-$(curl --silent "${auth[@]}" "$base/accounts?per_page=2" | jq -r 'if (.result | length) == 1 then .result[0].id else empty end')}"
          [ -n "$account_id" ] || fail "no account id: the secret is empty and the token does not see exactly one account" '{}'
          echo "account $account_id"

          # One tunnel of this name; reuse it if an earlier run made it.
          existing="$(curl --silent "${auth[@]}" "$base/accounts/$account_id/cfd_tunnel?name=$TUNNEL_NAME&is_deleted=false")"
          tunnel_id="$(echo "$existing" | jq -r '.result[0].id // empty')"
          if [ -z "$tunnel_id" ]; then
            created="$(curl --silent "${auth[@]}" -X POST "$base/accounts/$account_id/cfd_tunnel" \
              --data "$(jq -cn --arg name "$TUNNEL_NAME" '{name: $name, config_src: "cloudflare"}')")"
            echo "$created" | jq -e '.success' >/dev/null || fail "creating the tunnel failed" "$created"
            tunnel_id="$(echo "$created" | jq -r '.result.id')"
            echo "created tunnel $tunnel_id"
          else
            echo "reusing tunnel $tunnel_id"
          fi

          # Ingress: the public name to the harness, everything else 404.
          ingress="$(curl --silent "${auth[@]}" -X PUT "$base/accounts/$account_id/cfd_tunnel/$tunnel_id/configurations" \
            --data "$(jq -cn --arg host "$SIM_HOSTNAME" --arg svc "$SIM_SERVICE" \
              '{config: {ingress: [{hostname: $host, service: $svc}, {service: "http_status:404"}]}}')")"
          echo "$ingress" | jq -e '.success' >/dev/null || fail "configuring the tunnel ingress failed" "$ingress"

          # DNS: the public name is a proxied CNAME to the tunnel.
          zone="$(curl --silent "${auth[@]}" "$base/zones?name=$SIM_ZONE" | jq -r '.result[0].id // empty')"
          [ -n "$zone" ] || fail "the zone $SIM_ZONE is not visible to this token" '{}'
          record="$(curl --silent "${auth[@]}" "$base/zones/$zone/dns_records?type=CNAME&name=$SIM_HOSTNAME")"
          record_id="$(echo "$record" | jq -r '.result[0].id // empty')"
          body="$(jq -cn --arg name "$SIM_HOSTNAME" --arg content "$tunnel_id.cfargotunnel.com" \
            '{type: "CNAME", name: $name, content: $content, proxied: true, ttl: 1}')"
          if [ -z "$record_id" ]; then
            dns="$(curl --silent "${auth[@]}" -X POST "$base/zones/$zone/dns_records" --data "$body")"
          else
            dns="$(curl --silent "${auth[@]}" -X PUT "$base/zones/$zone/dns_records/$record_id" --data "$body")"
          fi
          echo "$dns" | jq -e '.success' >/dev/null || fail "writing the DNS record failed" "$dns"
          echo "dns: $SIM_HOSTNAME -> $tunnel_id.cfargotunnel.com"

          # The connector token goes to the host and nowhere else.
          token_json="$(curl --silent "${auth[@]}" "$base/accounts/$account_id/cfd_tunnel/$tunnel_id/token")"
          echo "$token_json" | jq -e '.success' >/dev/null || fail "reading the tunnel token failed" "$token_json"
          echo "$token_json" | jq -r '.result' | ssh sim 'umask 077; { printf "TUNNEL_TOKEN="; cat; } > ~/analog-canvas-sim/secrets/tunnel.env && echo "tunnel.env written ($(wc -c < ~/analog-canvas-sim/secrets/tunnel.env) bytes)"'
          ssh sim "~/analog-canvas-sim/releases/$GITHUB_SHA/containers/ngspice/host/deploy.sh"

      - name: Build and deploy the tracked host topology
        if: github.event_name == 'push' || inputs.action == 'deploy'
        run: |
          set -euo pipefail
          ssh sim "~/analog-canvas-sim/releases/$GITHUB_SHA/containers/ngspice/host/deploy.sh"
          ssh sim '~/analog-canvas-sim/current/containers/ngspice/verify-host-runtime.sh'

      - name: Verify the host answers through its tunnel
        if: github.event_name == 'push' || inputs.action != 'probe'
        run: |
          set -euo pipefail
          # Until the tunnel has been bootstrapped there is no public name to
          # ask; a rebuild is then verified from inside the host's own network,
          # and says so, rather than failing for the tunnel's absence.
          if [ -z "$(ssh sim 'docker ps --quiet --filter name=^analog-canvas-tunnel$')" ]; then
            echo "::notice::no tunnel is running on the host yet; verifying inside its network"
            ssh sim '~/analog-canvas-sim/current/containers/ngspice/host/health.sh' > /tmp/health.json
            jq -e '.status == "ready"' /tmp/health.json >/dev/null || { echo "::error::the harness is not ready on the host"; cat /tmp/health.json || true; exit 1; }
            echo "ready on the host: ngspice $(jq -r '.environment.simulator.version' /tmp/health.json)"
            exit 0
          fi
          for _ in $(seq 1 30); do
            if curl --silent --fail --max-time 10 "https://$SIM_HOSTNAME/health" > /tmp/health.json; then break; fi
            sleep 10
          done
          jq -e '.status == "ready"' /tmp/health.json >/dev/null || { echo "::error::the host is not ready through the tunnel"; cat /tmp/health.json || true; exit 1; }
          echo "ready: ngspice $(jq -r '.environment.simulator.version' /tmp/health.json), models $(jq -r '.environment.models.id' /tmp/health.json)"
          # /run must refuse a caller without the token: the host is public by name, not by use.
          status="$(curl --silent --output /dev/null --write-out '%{http_code}' --max-time 10 -X POST -H 'content-type: application/json' --data '{"deck":"x\n.end\n"}' "https://$SIM_HOSTNAME/run")"
          [ "$status" = "401" ] || { echo "::error::/run answered $status to a caller without the token; it must answer 401"; exit 1; }
          echo "/run without the token: 401, as required"

  # Replacing the CI's SSH key takes two runs, so the host is never left
  # without a key GitHub holds: authorize (with the old key) adds the new
  # public key; after SIM_HOST_SSH_KEY in cloudflare-preview holds the new
  # private key, retire (which can only log in with the new key) removes the
  # old one. Other keys in authorized_keys are never touched, every edit is
  # checked with ssh-keygen before it replaces the file, and only the Owner
  # may change who logs in to the host.
  ssh-key:
    if: github.event_name == 'workflow_dispatch' && (inputs.action == 'authorize-ssh-key' || inputs.action == 'retire-ssh-key') && github.triggering_actor == 'Arcadia-1'
    name: ${{ inputs.action }}
    runs-on: ubuntu-latest
    environment: cloudflare-preview
    timeout-minutes: 5
    steps:
      - name: Reach the host with the key in SIM_HOST_SSH_KEY
        env:
          SIM_HOST_SSH_KEY: ${{ secrets.SIM_HOST_SSH_KEY }}
          SIM_HOST_KNOWN_HOSTS: ${{ secrets.SIM_HOST_KNOWN_HOSTS }}
          SIM_HOST_ADDR: ${{ secrets.SIM_HOST_ADDR }}
          SIM_HOST_USER: ${{ secrets.SIM_HOST_USER }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SIM_HOST_SSH_KEY" > ~/.ssh/sim_host
          chmod 600 ~/.ssh/sim_host
          printf '%s\n' "$SIM_HOST_KNOWN_HOSTS" > ~/.ssh/known_hosts
          printf 'Host sim\n HostName %s\n User %s\n IdentityFile ~/.ssh/sim_host\n IdentitiesOnly yes\n BatchMode yes\n ConnectTimeout 20\n' "$SIM_HOST_ADDR" "$SIM_HOST_USER" > ~/.ssh/config
          # "type body" of the key this run logs in with; public, so printable.
          ssh-keygen -y -f ~/.ssh/sim_host | cut -d' ' -f1,2 > current.pub
          ssh sim true
          echo "logged in with $(ssh-keygen -lf current.pub)"

      - name: Authorize the new key next to the current one
        if: inputs.action == 'authorize-ssh-key'
        env:
          NEW_PUBLIC_KEY: ${{ inputs.public_key }}
        run: |
          set -euo pipefail
          if ! [[ "$NEW_PUBLIC_KEY" =~ ^ssh-ed25519\ [A-Za-z0-9+/]+={0,2}(\ [A-Za-z0-9@._-]+)?$ ]]; then
            echo "::error::public_key must be one ssh-ed25519 public key line"
            exit 1
          fi
          printf '%s\n' "$NEW_PUBLIC_KEY" > new.pub
          ssh-keygen -lf new.pub
          ssh sim "CURRENT='$(cat current.pub)' NEW='$NEW_PUBLIC_KEY' bash -s" <<'HOST'
          set -euo pipefail
          cd ~/.ssh
          fp() { local f; f=$(mktemp); printf '%s\n' "$1" > "$f"; ssh-keygen -lf "$f" 2>/dev/null | cut -d' ' -f2; rm -f "$f"; }
          listed() { ssh-keygen -lf "${1:-authorized_keys}" 2>/dev/null | cut -d' ' -f2; }
          current_fp=$(fp "$CURRENT")
          new_fp=$(fp "$NEW")
          [ -n "$current_fp" ] && [ -n "$new_fp" ] || { echo "a key does not parse; nothing changed" >&2; exit 1; }
          listed | grep -qxF "$current_fp" || { echo "the key in use is not in ~/.ssh/authorized_keys; nothing changed" >&2; exit 1; }
          if listed | grep -qxF "$new_fp"; then
            echo "the new key was already authorized"
          else
            line=$(grep -F "$CURRENT" authorized_keys | head -n 1) || { echo "the line of the key in use was not found; nothing changed" >&2; exit 1; }
            cp authorized_keys authorized_keys.next
            [ -z "$(tail -c 1 authorized_keys.next)" ] || echo >> authorized_keys.next
            # Same options (from=, command=, …) as the line of the key in use.
            printf '%s%s\n' "${line%%"$CURRENT"*}" "$NEW" >> authorized_keys.next
            if ! { listed authorized_keys.next | grep -qxF "$current_fp" && listed authorized_keys.next | grep -qxF "$new_fp"; }; then
              rm -f authorized_keys.next
              echo "the edited file would not list both keys; nothing changed" >&2
              exit 1
            fi
            cp authorized_keys authorized_keys.before-authorize
            chmod 600 authorized_keys.next
            mv authorized_keys.next authorized_keys
            echo "new key authorized"
          fi
          printf '%s\n' "$CURRENT" > ci-key-retiring.pub
          chmod 600 authorized_keys ci-key-retiring.pub
          HOST

      - name: Retire the previous key
        if: inputs.action == 'retire-ssh-key'
        run: |
          set -euo pipefail
          ssh sim "CURRENT='$(cat current.pub)' bash -s" <<'HOST'
          set -euo pipefail
          cd ~/.ssh
          fp() { local f; f=$(mktemp); printf '%s\n' "$1" > "$f"; ssh-keygen -lf "$f" 2>/dev/null | cut -d' ' -f2; rm -f "$f"; }
          listed() { ssh-keygen -lf "${1:-authorized_keys}" 2>/dev/null | cut -d' ' -f2; }
          [ -s ci-key-retiring.pub ] || { echo "no key is waiting to be retired" >&2; exit 1; }
          old=$(cat ci-key-retiring.pub)
          old_fp=$(fp "$old")
          current_fp=$(fp "$CURRENT")
          [ -n "$old_fp" ] && [ -n "$current_fp" ] || { echo "a key does not parse; nothing removed" >&2; exit 1; }
          if [ "$old_fp" = "$current_fp" ]; then
            echo "this run still logs in with the key it would remove; put the new key in SIM_HOST_SSH_KEY first" >&2
            exit 1
          fi
          listed | grep -qxF "$current_fp" || { echo "the key in use is not in authorized_keys; nothing removed" >&2; exit 1; }
          grep -vF "$old" authorized_keys > authorized_keys.next || true
          if ! listed authorized_keys.next | grep -qxF "$current_fp"; then
            rm -f authorized_keys.next
            echo "the edited file would not list the key in use; nothing removed" >&2
            exit 1
          fi
          cp authorized_keys authorized_keys.before-retire
          chmod 600 authorized_keys.next
          mv authorized_keys.next authorized_keys
          rm ci-key-retiring.pub
          echo "previous key removed; $(listed | grep -c .) key(s) remain"
          HOST
          ssh sim true
          echo "the host still answers with the new key"
