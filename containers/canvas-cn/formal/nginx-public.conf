# The release runner renders this server using the host's public settings.
server {
    listen @LISTEN@;
    server_name analog-canvas.tokenzhang.com;
    ssl_certificate /etc/letsencrypt/live/analog-canvas.tokenzhang.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/analog-canvas.tokenzhang.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 256m;
    location ~ "^/assets/[\w.-]+-[\w-]{8,}\.[\w]+$" {
        root /opt/analog-canvas/current-formal/assets;
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
        error_page 404 = @missing_build_asset;
    }
    location @missing_build_asset {
        add_header Cache-Control "no-store" always;
        return 404;
    }
    if ($host != analog-canvas.tokenzhang.com) { return 421; }
    location /downloads/mcp/ {
        alias /opt/analog-canvas/current-formal/downloads/mcp/;
        default_type application/gzip;
    }
    location / {
        proxy_pass http://127.0.0.1:8794;
        proxy_http_version 1.1;
        proxy_set_header Host @UPSTREAM_HOST@;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $canvas_cn_formal_connection;
        proxy_set_header Accept-Encoding "";
        proxy_buffering off;
        proxy_request_buffering on;
        proxy_read_timeout 150s;
        sub_filter '</head>' '<meta name="canvas-icp-filing" content="@FILING_NUMBER@"></head>';
    }
}

# Fixed peer entrance: no browser pages, sign-in endpoints or arbitrary proxying.
# The certificate includes this DNS-only name; the Worker sees its canonical host.
server {
    listen @LISTEN@;
    server_name canvas-hangzhou-origin.tokenzhang.com;
    ssl_certificate /etc/letsencrypt/live/analog-canvas.tokenzhang.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/analog-canvas.tokenzhang.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 16k;
    location ~ ^/api/resource-actions/(lifecycle|component|review-resolution|like|board)$ {
        client_max_body_size 512k;
        limit_except POST { deny all; }
        proxy_pass http://127.0.0.1:8794;
        proxy_http_version 1.1;
        proxy_set_header Host analog-canvas.tokenzhang.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Connection close;
        proxy_request_buffering on;
        proxy_read_timeout 150s;
    }
    location ~ ^/api/resource-actions/(publication|maintenance)$ {
        client_max_body_size 4m;
        limit_except POST { deny all; }
        proxy_pass http://127.0.0.1:8794;
        proxy_http_version 1.1;
        proxy_set_header Host analog-canvas.tokenzhang.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Connection close;
        proxy_request_buffering on;
        proxy_read_timeout 150s;
    }
    location ~ ^/api/resource-sync/((components|(gallery|analoggenie|circuitthink|amsnet|analogretriever|image2net)(-interactions|-opens|-activity)?)/(changes|status)|(analoggenie|circuitthink|amsnet|analogretriever|image2net)/location)$ {
        limit_except GET { deny all; }
        proxy_pass http://127.0.0.1:8794;
        proxy_http_version 1.1;
        proxy_set_header Host analog-canvas.tokenzhang.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Connection close;
        proxy_read_timeout 150s;
    }
    location / { return 404; }
}
