map $http_upgrade $canvas_cn_formal_connection {
    default upgrade;
    '' close;
}

# SSH forwards browser localhost:18082 to this loopback listener.
server {
    listen 127.0.0.1:8082;
    server_name localhost;
    # Match the existing Agent transfer artifact limit.
    client_max_body_size 256m;
    # Public immutable build files do not depend on the restarting Worker.
    location ~ "^/assets/[\w.-]+-[\w-]{8,}\.[\w]+$" {
        root /opt/analog-canvas/current-formal/assets;
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
        error_page 404 = @missing_build_asset;
    }
    location @missing_build_asset {
        add_header Cache-Control "no-store" always;
        return 404;
    }
    # The pinned MCP bundle, the same bytes as the GitHub release.
    location /downloads/mcp/ {
        alias /opt/analog-canvas/current-formal/downloads/mcp/;
        default_type application/gzip;
    }
    location / {
        proxy_pass http://127.0.0.1:8794;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        # The runtime's only trusted client address (regional rate limits).
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $canvas_cn_formal_connection;
        proxy_buffering off;
        proxy_request_buffering on;
        proxy_read_timeout 75s;
    }
}

# The Worker's ASSETS binding; never points back to the API listener.
server {
    listen 127.0.0.1:8083;
    server_name localhost;
    root /opt/analog-canvas/current-formal/assets;
    location /assets/ {
        try_files $uri =404;
    }
    location / {
        try_files $uri /index.html;
    }
}
