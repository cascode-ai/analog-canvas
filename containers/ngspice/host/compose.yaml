name: analog-canvas-sim

services:
  executor:
    image: analog-canvas-ngspice:${SIMULATION_IMAGE_TAG:-local}
    build:
      context: ../../..
      dockerfile: containers/ngspice/Dockerfile
    container_name: analog-canvas-ngspice-executor
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    cpus: 8.0
    mem_limit: 16g
    volumes:
      - run-root:/var/lib/simulation
      # ngspice opens its scratch files with tmpfile(), which glibc always
      # places under /tmp — TMPDIR is not consulted. With a read-only root and
      # no mount here every run died at once ("tmpfile(): Read-only file
      # system") and the preview's simulation was down from 15:11Z to the fix
      # on 2026-09-04. A private tmpfs, world-writable with the sticky bit
      # (Docker's default mode for a tmpfs mount), is what the simulator needs
      # and nothing a deck writes there survives the container.
      - type: tmpfs
        target: /tmp
        tmpfs:
          size: 1073741824
    networks:
      - simulation

  # The public tunnel reaches this small trusted process. The bearer token is
  # deliberately absent from `executor`: an authored .control program runs
  # there under the same uid as the harness and must not be able to recover
  # the credential from /proc or inherited process state.
  simulator:
    image: analog-canvas-ngspice:${SIMULATION_IMAGE_TAG:-local}
    container_name: analog-canvas-ngspice
    command:
      - node
      - /opt/harness/gateway.mjs
    environment:
      SIMULATION_ACCESS_TOKEN: ${SIMULATION_ACCESS_TOKEN:?set SIMULATION_ACCESS_TOKEN in the host runtime env}
      SIMULATION_EXECUTOR_URL: http://executor:8080
    depends_on:
      - executor
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    cpus: 0.5
    mem_limit: 256m
    networks:
      - simulation

  tunnel:
    image: cloudflare/cloudflared:2025.8.1@sha256:b77d84e8704db38db22c22661cf7e56468c526e3a6a5fe9c8b7c151452fa1472
    container_name: analog-canvas-tunnel
    profiles:
      - tunnel
    command:
      - tunnel
      - --no-autoupdate
      - run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:-}
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    networks:
      tunnel-egress:
        gw_priority: 1
      simulation: {}

volumes:
  run-root:
    name: analog-canvas-simulation-run-root

networks:
  simulation:
    name: analog-canvas-sim-internal
    internal: true
  tunnel-egress:
    name: analog-canvas-tunnel-egress
